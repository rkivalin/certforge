# Certforge configuration
#
# This is a reference configuration. Uncomment and adjust the sections
# below to match your environment. No certificates will be managed
# until at least one [[certificate]] block is uncommented.

[acme]
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
# Use staging for testing:
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# ACME account key: stored as encrypted systemd credential
# account_key_credential = "/etc/credstore.encrypted/acme-account-key"
# Or as a plain file:
account_key_path = "/etc/certforge/account.key"

contact = ["mailto:admin@example.com"]

# Default DNS server for RFC 2136 updates
[dns.defaults]
server = "ns1.example.com"
# tsig_key_credential = "/etc/credstore.encrypted/dns-tsig-key"
tsig_key_path = "/etc/certforge/tsig.key"
tsig_key_name = "certforge."
tsig_algorithm = "hmac-sha256"
port = 53
protocol = "tcp"

# Per-zone DNS overrides (optional)
# [dns.zones."example.org"]
# server = "ns2.example.org"
# tsig_key_credential = "/etc/credstore.encrypted/dns-tsig-org"

