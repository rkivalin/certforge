# Certforge configuration
#
# This is a reference configuration. Uncomment and adjust the sections
# below to match your environment. No certificates will be managed
# until at least one [[certificate]] block is uncommented.

[acme]
directory_url = "https://acme-v02.api.letsencrypt.org/directory"
# Use staging for testing:
# directory_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# ACME account key: stored as encrypted systemd credential
# account_key_credential = "/etc/credstore.encrypted/acme-account-key"
# Or as a plain file:
account_key_path = "/etc/certforge/account.key"

contact = ["mailto:admin@example.com"]

# Default solver for all certificates (can be overridden per-certificate)
# default_solver = "dns"

# DNS client connections — referenced by solvers and DANE blocks
[dns.main]
server = "ns1.example.com"
# Single zone:
zone = "example.com"
# Multiple zones on the same server (longest suffix match):
# zones = ["example.com", "example.org"]
# tsig_key_credential = "/etc/credstore.encrypted/dns-tsig-key"
tsig_key_path = "/etc/certforge/tsig.key"
tsig_key_name = "certforge."
tsig_algorithm = "hmac-sha256"
port = 53
protocol = "tcp"

# Additional DNS clients (e.g., different server or TSIG key)
# [dns.other]
# server = "ns2.example.org"
# zone = "example.org"
# tsig_key_credential = "/etc/credstore.encrypted/dns-tsig-org"
# tsig_key_name = "certforge-org."

# Challenge solvers
[solver.dns]
type = "dns-01"
dns = "main"                    # references [dns.main]
# propagation_delay = 5         # seconds to wait for DNS propagation (default: 5)

# [solver.dns-org]
# type = "dns-01"
# dns = "org"

# [solver.http]
# type = "http-01"
# listen = "[::]:80"            # single address
# # listen = ["[::]:80", "[::]:8080"]  # multiple: try all, succeed if any binds
# # OR: webroot = "/var/www/acme"

# [solver.tls]
# type = "tls-alpn-01"
# listen = "[::]:443"           # single or list like http-01

# Named hooks — run once after all renewals, deduplicated across certificates.
# Hooks run in the order defined here.
# [[hook]]
# name = "reload-postfix"
# type = "systemd-reload"
# unit = "postfix.service"
#
# [[hook]]
# name = "reload-nginx"
# type = "systemd-reload"
# unit = "nginx.service"

